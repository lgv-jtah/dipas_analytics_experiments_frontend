server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the app under its base path
    location /dipas-analytics-evaluation/ {
        alias /usr/share/nginx/html/dipas-analytics-evaluation/;
        try_files $uri $uri/ /dipas-analytics-evaluation/index.html;
    }

    # Redirect root to the app base path
    location = / {
        return 301 /dipas-analytics-evaluation/;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
